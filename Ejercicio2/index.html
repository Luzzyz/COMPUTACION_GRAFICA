<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de reserva</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <div class="form-container">
            <header class="form-header">
                <span class="eyebrow">Reservas</span>
                <h1>Reserva tu mesa</h1>
                <p>Elige fecha, hora y número de personas para tu visita.</p>
            </header>

            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-field">
                        <label for="fecha">Fecha *</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                    <div class="form-field">
                        <label for="hora">Hora *</label>
                        <input type="time" id="hora" name="hora" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="personas">Número de personas *</label>
                    <input type="number" id="personas" name="personas" min="1" max="20" step="1" value="2" required>
                </div>

                <div class="form-field">
                    <label for="comentarios">Comentarios adicionales</label>
                    <textarea id="comentarios" name="comentarios" rows="5" maxlength="300"
                        placeholder="Alergias, celebraciones especiales, etc."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">Confirmar reserva</button>
                    <button type="reset" class="button button-secundario">Limpiar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
