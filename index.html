<!DOCTYPE html>


<!--lang es el lenguaje-->
<html lang="es">

<head>
    <!--metadatos-->
    <!--UTF-8 ASCII-->
    <meta charset="UTF-8">
    <!--Para que el documento interactue-->
    <!--Responsivo-->
    <meta name="viewport" content="width=device-width" , initial-scale="1.0">

    <title>Formulario básico</title>
    <!--Cuando la hoja de estilos esta en una carpeta se tiene que poner la ruta con la carpeta-->
    <link rel="stylesheet" href="./CSS/styles.css">
</head>


<body>
    <h1>Formulario de contacto</h1>

    <!--Action sirve para definir la accion que va a suceder, define quien va a procesar la accion
    method define como se va a procesar la accion-->
    <form action="#" method="POST">
        <!--Esto es un formulario-->
        <div class="form-field">
            <!--Etiquetas indicativas, no realizan nada-->
            <label for="nombre">Nombre</label>
            <!--input es la entrada y hay varios tipos de input, el id identifica al tipo de entrada-->
            <!--required indica que es obligatorio-->
            <input type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Tu nombre" 
            required
            autocomplete="name"> <!--recupera de las cookies del navegador para autocompletar-->
        </div>

        <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input type="email" 
            id="email" 
            name="email" 
            placeholder="tu correo electrónico" 
            autocomplete="email" required>
        </div>

        <div class="form-field">
            <label for="password">Contraseña</label>
            <input type="password" 
            id="password" 
            name="password" 
            minlength="6" 
            autocomplete="mi password" 
            required  >
        </div>

        <div class="form-field">
            <label for="telefono">Teléfono</label>
            <input type="tel"
            id="telefono"
            name="telefono"
            placeholder="+57 300 000 00 00"
            autocomplete="tel">
        </div>


        <div class="form-field">
            <label for="sitio">Sitio web</label>
            <input type="url"
            id="sitio"
            name="sitio"
            placeholder="https://www.miempresa.com">
        </div>

        <div class="form-field">
            <label for="empleados">Número de empleados</label>
            <input type="number"
            id="empleados"
            name="empleados"
            min="1"
            max="5"
            step="1">
        </div>

        <div class="form-field">
            <label for="fecha">Seleccione fecha</label>
            <input type="date"
            id="fecha"
            name="fecha"
            >
        </div>

        <div class="form-field">
            <label for="hora">Seleccione hora</label>
            <input type="time"
            id="hora"
            name="hora">
        </div>

        <div class="form-field">
            <label for="fecha-hora">Seleccione fecha y hora</label>
            <input type="datetime-local"
            id="fecha-hora"
            name="fecha-hora">
        </div>

        <div class="form-field">
            <label for="semana">Seleccione semana</label>
            <input type="week"
            id="semana"
            name="semana">
        </div>

        <div class="form-field">
            <label for="mes">Seleccione mes</label>
            <input type="month"
            id="mes"
            name="mes">
        </div>

        <div class="form-field">
            <label for="servicio">Seleccione el servicio</label>
            <select id="servicio" name="servicio" required>
                <option value="">
                    Seleccione opción
                </option>

                <option value="pentesting">
                    Pentesting web
                </option>

                <option value="devsecops">
                    DevSecOps
                </option>

                <option value="ai-security">
                    AI security
                </option>
            </select>

            <select id="servicio" name="servicio" required>

                <optgroup label="Servicios de seguridad">

                    <option value="pentesting">
                        Pentesting web
                    </option>

                    <option value="devsecops">
                        DevSecOps
                    </option>

                    <option value="ai-security">
                        AI security
                    </option>
                </optgroup>

                <optgroup label="Desarrollo de software">
                    <option value="Dev 1">
                        Software a la medidad
                    </option>

                    <option value="Dev 2">
                        Azure y AWS
                    </option>

                    <option value="dev">
                        Análisis Funcional
                    </option>
                </optgroup>

            </select>
        </div>
        
        <!--Crear radio buttons-->
        <div class="form-field">    
            <fieldset>
                <legend>Tipo de contacto</legend>
                <label>
                
                    <input type="radio"
                    name="tipo-contacto"
                    value="correo"
                    checked>
                    Correo electrónico
                </label>

                <label>
                    <input type="radio"
                    name="tipo-contacto"
                    value="telefono">
                    Teléfono
                </label>
                
                <label>
                    <input type="radio"
                    name="tipo-contacto"
                    value="videollamada">
                    Video Llamada
                </label>   
            </fieldset>
        </div>

        <div class="form-field">
            <fieldset>

                <legend>Temas de interés</legend>
                <label>
                    <input type="checkbox"
                    name="intereses"
                    value="ciberseguridad">
                    Ciberseguridad
                </label>

                <label>
                    <input type="checkbox"
                    name="intereses"
                    value="hacking-etico">
                    Hacking ético
                </label>

                <label>
                    <input type="checkbox"
                    name="intereses"
                    value="seguridad">
                    Firewalls
                </label>
            </fieldset>
        </div>

        <div class="form-field">
            <label for="mensaje">Cuentanos tu necesidad</label>
            <textarea id="mensaje"
            name="mensaje"
            rows="7"
            maxlength="200"
            placeholder="Escribe brevemente tu necesidad"
            required>

            </textarea>

        </div>

        <div class="form-field">
            <label for="archivo">Adjuntar archivo</label>
            <input type="file"
            id="archivo"
            name="archivo"
            accept=".pdf,.docx,.xlsx,.xls"
            multiple>
        </div>

        <div class="form-field">
            <label for="archivo">Adjuntar archivo de imagen</label>
            <input type="file"
            id="archivo"
            name="archivo"
            accept="image/*"
            multiple>
        </div>

        <div class="form-field">
            <label for="prioridad">Prioridad estimada</label>
            <input type="range"
            id="prioridad"
            name="prioridad"
            min="1"
            max="10"
            value="5">
        </div>

        <div class="form-field">
            <label for="color">Selecciona el color</label>
            <input type="color"
            id="color"
            name="color"
            value="#0d5bea">
        </div>

        <div class="form-field">
            <label for="ciudades">Ciudades</label>
            <input type="text"
            id="ciudad"
            name="ciudad"
            list="ciudades">

            <datalist id="ciudades">
                <option value="Pasto"></option>
                <option value="Bogota"></option>
                <option value="Cali"></option>
            </datalist>
        </div>

        <div class="form-actions">
            <button type="submit" class="button button-primary">Enviar formulario</button>
        </div>
    </form>
    </form>
</body>


</html>
