<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>

<body>
    <main class="form-page">
        <section class="form-section">
            <div class="form-container">

                <header class="form-header">
                    <span class="eyebrow">CONTACTO</span>
                    <h1>Hablemos sobre su proyecto</h1>
                    <p>Complete la información y utilizaremos estos datos para comprender su necesidad.</p>
                </header>

                <form class="contact-form" action="#" method="post">

                    <fieldset class="campo-grupo">
                        <legend>Datos personales</legend>

                        <div class="form-row">
                            <div class="form-field">
                                <label for="nombre">Nombre *</label>
                                <input type="text" id="nombre" name="nombre"
                                    placeholder="Tu nombre" minlength="2" maxlength="50"
                                    required autocomplete="name">
                            </div>

                            <div class="form-field">
                                <label for="apellido">Apellido *</label>
                                <input type="text" id="apellido" name="apellido"
                                    placeholder="Tu apellido" minlength="2" maxlength="50"
                                    required autocomplete="family-name">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-field">
                                <label for="email">Correo electrónico *</label>
                                <input type="email" id="email" name="email"
                                    placeholder="nombre@empresa.com" autocomplete="email" required>
                            </div>

                            <div class="form-field">
                                <label for="telefono">Teléfono</label>
                                <input type="tel" id="telefono" name="telefono"
                                    placeholder="+57 300 000 00 00"
                                    pattern="^\+?[0-9]{7,13}$"
                                    title="Ingrese un número válido, ej: +573000000000"
                                    autocomplete="tel">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="campo-grupo">
                        <legend>Organización</legend>

                        <div class="form-row">
                            <div class="form-field">
                                <label for="sitio">Sitio web</label>
                                <input type="url" id="sitio" name="sitio"
                                    placeholder="https://www.miempresa.com">
                            </div>

                            <div class="form-field">
                                <label for="empleados">Número de empleados</label>
                                <input type="number" id="empleados" name="empleados"
                                    min="1" max="500" step="1">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="codigo">Código de cliente</label>
                            <input type="text" id="codigo" name="codigo"
                                pattern="[A-Z]{3}-[0-9]{4}"
                                placeholder="ABC-1234"
                                title="Use tres letras mayúsculas, guion y cuatro números">
                        </div>

                        <div class="form-field">
                            <label for="servicio">Servicio de interés *</label>
                            <select id="servicio" name="servicio" required>
                                <option value="">Seleccione un servicio</option>
                                <optgroup label="Servicios de seguridad">
                                    <option value="pentesting">Pentesting web</option>
                                    <option value="devsecops">DevSecOps</option>
                                    <option value="ai-security">AI security</option>
                                </optgroup>
                                <optgroup label="Desarrollo de software">
                                    <option value="software-medida">Software a la medida</option>
                                    <option value="cloud">Azure y AWS</option>
                                    <option value="analisis">Análisis funcional</option>
                                </optgroup>
                            </select>
                        </div>
                    </fieldset>

                    <fieldset class="campo-grupo">
                        <legend>Disponibilidad</legend>
                        <div class="form-row">
                            <div class="form-field">
                                <label for="fecha">Fecha preferida</label>
                                <input type="date" id="fecha" name="fecha">
                            </div>
                            <div class="form-field">
                                <label for="hora">Hora preferida</label>
                                <input type="time" id="hora" name="hora">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="campo-grupo">
                        <legend>Modalidad de contacto</legend>
                        <label class="opcion">
                            <input type="radio" name="tipo-contacto" value="correo" checked>
                            Correo electrónico
                        </label>
                        <label class="opcion">
                            <input type="radio" name="tipo-contacto" value="telefono">
                            Teléfono
                        </label>
                        <label class="opcion">
                            <input type="radio" name="tipo-contacto" value="videollamada">
                            Videollamada
                        </label>
                    </fieldset>

                    <fieldset class="campo-grupo">
                        <legend>Temas adicionales de interés</legend>
                        <label class="opcion">
                            <input type="checkbox" name="intereses" value="seguridad-apps">
                            Seguridad de aplicaciones
                        </label>
                        <label class="opcion">
                            <input type="checkbox" name="intereses" value="cloud-security">
                            Cloud Security
                        </label>
                        <label class="opcion">
                            <input type="checkbox" name="intereses" value="ai-security">
                            AI Security
                        </label>
                    </fieldset>

                    <div class="form-field">
                        <label for="mensaje">Describa su necesidad *</label>
                        <textarea id="mensaje" name="mensaje" rows="6"
                            minlength="10" maxlength="1200"
                            placeholder="Cuéntenos brevemente qué necesita..." required></textarea>
                        <span class="ayuda">Entre 10 y 1200 caracteres.</span>
                    </div>

                    <div class="form-field">
                        <label for="archivo">Documento de soporte</label>
                        <input type="file" id="archivo" name="archivo"
                            accept=".pdf,.docx,.xlsx,.xls" multiple>
                        <span class="ayuda">Formatos sugeridos: PDF, Word o Excel.</span>
                    </div>

                    <div class="form-field-check">
                        <label class="opcion">
                            <input type="checkbox" name="aceptacion" required>
                            Acepto el tratamiento de la información suministrada.
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button button-primary">Enviar solicitud</button>
                        <button type="reset" class="button button-secundario">Limpiar</button>
                    </div>
                </form>

            </div>
        </section>
    </main>
</body>

</html>
