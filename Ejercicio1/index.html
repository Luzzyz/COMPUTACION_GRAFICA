<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <div class="form-container">
            <header class="form-header">
                <span class="eyebrow">Registro</span>
                <h1>Crea tu cuenta</h1>
                <p>Completa tus datos para registrarte en la plataforma.</p>
            </header>

            <form action="#" method="post">
                <div class="form-field">
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" maxlength="60"
                        placeholder="Tu nombre completo" required autocomplete="name">
                </div>

                <div class="form-field">
                    <label for="correo">Correo electrónico *</label>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com"
                        required autocomplete="email">
                </div>

                <div class="form-field">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" minlength="8"
                        placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                </div>

                <div class="form-field">
                    <label for="confirmar">Confirmar contraseña *</label>
                    <input type="password" id="confirmar" name="confirmar" minlength="8"
                        placeholder="Repite tu contraseña" required autocomplete="new-password">
                </div>

                <div class="form-field-check">
                    <label class="opcion">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <span class="check-visual"></span>
                        Acepto los términos y condiciones
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">Registrarme</button>
                    <button type="reset" class="button button-secundario">Limpiar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
