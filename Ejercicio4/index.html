<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud laboral</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="form-page">
        <div class="form-container">
            <header class="form-header">
                <span class="eyebrow">Empleo</span>
                <h1>Postúlate a una vacante</h1>
                <p>Completa tus datos y adjunta tu hoja de vida.</p>
            </header>

            <form action="#" method="post" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-field">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" name="nombre" minlength="3" required autocomplete="name">
                    </div>
                    <div class="form-field">
                        <label for="correo">Correo electrónico *</label>
                        <input type="email" id="correo" name="correo" required autocomplete="email">
                    </div>
                </div>

                <div class="form-field">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" pattern="^\+?[0-9]{7,13}$"
                        placeholder="+57 300 000 00 00" title="Ingrese un número válido">
                </div>

                <div class="form-field">
                    <label for="vacante">Vacante de interés *</label>
                    <select id="vacante" name="vacante" required>
                        <option value="">Seleccione una vacante</option>
                        <option value="desarrollador">Desarrollador Frontend</option>
                        <option value="analista">Analista de Seguridad</option>
                        <option value="soporte">Soporte Técnico</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="cv">Adjuntar hoja de vida (CV) *</label>
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
                    <span class="ayuda">Formatos aceptados: PDF, DOC o DOCX. Máximo 5MB.</span>
                </div>

                <div class="form-field">
                    <label for="carta">Carta de presentación</label>
                    <textarea id="carta" name="carta" rows="5" maxlength="500"
                        placeholder="Cuéntanos brevemente por qué eres el candidato ideal..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">Enviar postulación</button>
                    <button type="reset" class="button button-secundario">Limpiar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
